services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expense_tracker}']
      interval: 5s
      timeout: 5s
      retries: 10

  dbhub:
    image: bytebase/dbhub:latest
    ports:
      - "8080:8080"
    command:
      - "--transport=http"
      - "--port=8080"
      - "--dsn=postgresql://postgres:postgres@postgres:5432/expense_tracker?schema=public"
    depends_on:
      - postgres

volumes:
  postgres-data:
